<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jules Verne — Musée Interactif</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080e;--surface:#12121c;--text:#ddd5c4;--dim:#998f7e;
  --gold:#c9a84c;--gold-bright:#e0c474;--gold-dim:#8b7339;
  --panel-bg:rgba(15,15,25,0.88);--font-t:'Cinzel',serif;--font-b:'Cormorant Garamond',serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08080e;--surface:#12121c;--text:#ddd5c4;--dim:#998f7e;
  --gold:#c9a84c;--gold-bright:#e0c474;--gold-dim:#8b7339;
}}
:root[data-theme="dark"]{
  --bg:#08080e;--surface:#12121c;--text:#ddd5c4;--dim:#998f7e;
  --gold:#c9a84c;--gold-bright:#e0c474;--gold-dim:#8b7339;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:18px;line-height:1.7;overflow:hidden}

#loader{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#loader h1{font-family:var(--font-t);font-size:2.4rem;color:var(--gold);letter-spacing:.15em;margin-bottom:.5rem}
#loader p{color:var(--dim);font-size:1rem;margin-bottom:2rem}
.pbar{width:240px;height:3px;background:var(--surface);border-radius:2px;overflow:hidden}
.pfill{height:100%;width:0;background:var(--gold);transition:width .3s}

#start{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .8s;padding:16px}
#start.out{opacity:0;pointer-events:none}
#sp-wrap{width:200px;height:260px;position:relative;margin-bottom:2rem;border-radius:4px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.7);background:var(--surface)}
#sp-wrap img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .6s}
#sp-wrap img.ld{opacity:1}
#sp-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#14141e,#1a1526,#14141e);position:relative}
#sp-fb::before{content:'';position:absolute;inset:10px;border:1px solid rgba(201,168,76,.12)}
#sp-fb span{font-family:var(--font-t);font-size:3.5rem;color:var(--gold);opacity:.2;letter-spacing:.1em}
#start h1{font-family:var(--font-t);font-size:2.6rem;color:var(--gold);letter-spacing:.12em;margin-bottom:.25rem}
.dates{font-family:var(--font-t);font-size:1rem;color:var(--dim);letter-spacing:.3em;margin-bottom:.25rem}
.sub{font-size:1.1rem;color:var(--dim);font-style:italic;margin-bottom:2rem}
.opts{margin-bottom:2rem}
.opts label{display:flex;align-items:center;gap:.5rem;color:var(--dim);font-size:.95rem;margin:.4rem 0;cursor:pointer;justify-content:center}
.opts input[type="checkbox"]{accent-color:var(--gold);width:16px;height:16px}
#go{font-family:var(--font-t);font-size:1rem;letter-spacing:.15em;background:transparent;color:var(--gold);border:1px solid var(--gold);padding:.8rem 2.5rem;cursor:pointer;transition:all .3s;text-transform:uppercase}
#go:hover{background:var(--gold);color:var(--bg)}

#museum{height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;display:none}
.ch{min-height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;position:relative;padding:3rem 16px 5.5rem}
.ch-in{max-width:800px;width:100%;display:flex;flex-direction:column;align-items:center;gap:1.5rem;opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}
.ch.vis .ch-in{opacity:1;transform:translateY(0)}
.ch-hdr{display:flex;align-items:baseline;gap:1rem}
.ch-n{font-family:var(--font-t);font-size:.85rem;color:var(--gold-dim);letter-spacing:.2em}
.ch-y{font-family:var(--font-t);font-size:.85rem;color:var(--dim);letter-spacing:.15em}

.exh{position:relative;width:100%;max-width:660px}
.exh-fr{position:relative;overflow:hidden;border-radius:2px;box-shadow:0 8px 40px rgba(0,0,0,.7);background:var(--surface);min-height:280px}
.exh-fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s;z-index:2}
.exh-fr img.ld{opacity:1}
.exh-fr::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(8,8,14,.45) 100%);pointer-events:none;z-index:3}
.exh-lb{font-size:.72rem;color:var(--dim);text-align:right;margin-top:.5rem;font-style:italic}

.exh-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:280px;background:linear-gradient(160deg,#14141e 0%,#1a1526 50%,#14141e 100%);position:relative;z-index:1}
.exh-ph::before{content:'';position:absolute;inset:12px;border:1px solid rgba(201,168,76,.1);pointer-events:none}
.exh-ph::after{content:'';position:absolute;inset:6px;border:1px solid rgba(201,168,76,.05);pointer-events:none}
.ph-num{font-family:var(--font-t);font-size:5rem;color:var(--gold);opacity:.12;letter-spacing:.15em;line-height:1}
.ph-lbl{font-family:var(--font-t);font-size:.8rem;color:var(--gold-dim);letter-spacing:.15em;margin-top:1rem;text-align:center}

@keyframes kb1{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-2%,-1%)}}
@keyframes kb2{0%{transform:scale(1.05) translate(1%,0)}100%{transform:scale(1) translate(-1%,2%)}}
@keyframes kb3{0%{transform:scale(1) translate(1%,1%)}100%{transform:scale(1.1) translate(-1%,-2%)}}
.ch:nth-child(odd) .exh-fr img.ld{animation:kb1 25s ease-in-out infinite alternate}
.ch:nth-child(even) .exh-fr img.ld{animation:kb2 25s ease-in-out infinite alternate}
.ch:nth-child(3n) .exh-fr img.ld{animation:kb3 30s ease-in-out infinite alternate}

.ch-t{font-family:var(--font-t);font-size:1.7rem;color:var(--gold);letter-spacing:.05em;text-align:center}
.ch-st{font-size:1rem;color:var(--dim);font-style:italic;text-align:center;margin-top:-.6rem}
.narr{background:var(--panel-bg);backdrop-filter:blur(8px);border-left:3px solid var(--gold-dim);padding:1.2rem 1.5rem;max-width:600px;width:100%;border-radius:0 4px 4px 0;font-size:1.05rem;line-height:1.8}
.qu{position:relative;max-width:520px;width:100%;padding:1rem 1.5rem 1rem 2.5rem;border:1px solid var(--gold-dim);border-radius:8px;background:rgba(201,168,76,.05)}
.qu::before{content:'\201C';position:absolute;left:.6rem;top:0;font-size:2.5rem;color:var(--gold);line-height:1;font-family:var(--font-t)}
.qu p{font-style:italic;color:var(--gold-bright);font-size:1rem}
.qu cite{display:block;text-align:right;color:var(--dim);font-size:.85rem;margin-top:.5rem;font-style:normal}

#tl{position:fixed;right:1.5rem;top:50%;transform:translateY(-50%);z-index:100;display:none;flex-direction:column;gap:.6rem}
.td{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold-dim);background:transparent;cursor:pointer;transition:all .3s;position:relative}
.td.on{background:var(--gold);border-color:var(--gold);transform:scale(1.3)}
.td:hover{border-color:var(--gold)}
.td .tlab{position:absolute;right:20px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--font-t);font-size:.7rem;color:var(--dim);opacity:0;transition:opacity .3s;pointer-events:none}
.td:hover .tlab,.td.on .tlab{opacity:1}

#ctrl{position:fixed;bottom:0;left:0;right:0;z-index:100;display:none;background:linear-gradient(transparent,rgba(8,8,14,.95));padding:1rem 16px 1.2rem}
.cr{display:flex;align-items:center;justify-content:center;gap:1.2rem;flex-wrap:wrap}
.cb{background:none;border:1px solid var(--gold-dim);color:var(--gold);font-family:var(--font-t);font-size:.72rem;letter-spacing:.1em;padding:.4rem .7rem;cursor:pointer;border-radius:3px;transition:all .3s}
.cb:hover,.cb.on{background:var(--gold);color:var(--bg)}
#np,#nn{font-size:1.1rem;padding:.3rem .6rem}
#ci{font-family:var(--font-t);font-size:.72rem;color:var(--dim);letter-spacing:.1em;min-width:70px;text-align:center}

#nd{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);max-width:600px;width:90%;background:rgba(8,8,14,.9);backdrop-filter:blur(8px);border:1px solid var(--gold-dim);border-radius:8px;padding:.8rem 1.2rem;font-size:.9rem;color:var(--text);text-align:center;z-index:99;opacity:0;transition:opacity .4s;pointer-events:none;max-height:120px;overflow-y:auto}
#nd.vis{opacity:1}

@media(max-width:600px){
  #start h1{font-size:1.8rem}
  .ch-t{font-size:1.3rem}
  .narr{font-size:.95rem;padding:1rem}
  #tl{right:.4rem}.td .tlab{display:none}
  #ctrl{padding:.7rem 8px .9rem}
  .cr{gap:.6rem}
  .ch{padding:2rem 16px 5rem}
  .ph-num{font-size:3.5rem}
}
#museum::-webkit-scrollbar{width:4px}
#museum::-webkit-scrollbar-track{background:var(--bg)}
#museum::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
</style>
</head>
<body>

<div id="loader"><h1>JULES VERNE</h1><p>Chargement du mus&eacute;e...</p><div class="pbar"><div class="pfill" id="pf"></div></div></div>
<div id="start">
  <div id="sp-wrap">
    <div id="sp-fb"><span>JV</span></div>
    <img id="start-portrait" alt="Jules Verne" onload="this.classList.add('ld')" onerror="this.style.display='none'">
  </div>
  <h1>JULES VERNE</h1>
  <div class="dates">1828 &#8212; 1905</div>
  <div class="sub">Voyages Extraordinaires &#8212; Mus&eacute;e Interactif</div>
  <div class="opts">
    <label><input type="checkbox" id="oN" checked> Narration vocale (fran&ccedil;ais)</label>
    <label><input type="checkbox" id="oM" checked> Musique de fond</label>
  </div>
  <button id="go">Entrer dans le mus&eacute;e</button>
</div>
<main id="museum"></main>
<nav id="tl"></nav>
<div id="ctrl"><div class="cr">
  <button class="cb" id="np" title="Pr&eacute;c&eacute;dent">&#9664;</button>
  <span id="ci">I / IX</span>
  <button class="cb" id="nn" title="Suivant">&#9654;</button>
  <button class="cb" id="bm">&#9835; Musique</button>
  <button class="cb" id="bn">&#9998; Narration</button>
</div></div>
<div id="nd"></div>

<script>
var R=['I','II','III','IV','V','VI','VII','VIII','IX'];
var CH=[
{t:'Nantes',st:"L'enfance au bord de la Loire",y:'1828',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/F%C3%A9lix_Nadar_1820-1910_portraits_Jules_Verne_%28restoration%29.jpg/800px-F%C3%A9lix_Nadar_1820-1910_portraits_Jules_Verne_%28restoration%29.jpg',
 cr:'F\u00e9lix Nadar, c. 1878 \u2014 Wikimedia Commons',
 txt:"Jules Verne na\u00eet le huit f\u00e9vrier mille huit cent vingt-huit, sur l'\u00eele Feydeau, \u00e0 Nantes. Le port grouille de navires. Les quais sentent le goudron et les \u00e9pices. L'enfant grandit berc\u00e9 par les r\u00e9cits de marins. \u00c0 douze ans, il tente de s'embarquer clandestinement sur un trois-m\u00e2ts en partance pour les Indes. Son p\u00e8re le rattrape de justesse.",
 ch:[110,130.81,164.81]},

{t:'Paris',st:'Les ann\u00e9es de jeunesse',y:'1848',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Jules_Verne_by_%C3%89tienne_Carjat.jpg/800px-Jules_Verne_by_%C3%89tienne_Carjat.jpg',
 cr:'\u00c9tienne Carjat, c. 1884 \u2014 Wikimedia Commons',
 txt:"En mille huit cent quarante-huit, Verne monte \u00e0 Paris. Il a vingt ans, un dipl\u00f4me de droit impos\u00e9 par son p\u00e8re, et des cahiers remplis de pi\u00e8ces de th\u00e9\u00e2tre. Il fr\u00e9quente les salons litt\u00e9raires, se lie avec Alexandre Dumas fils, \u00e9crit des vaudevilles qui ne rapportent rien. Il \u00e9pouse Honorine de Viane en mille huit cent cinquante-sept et devient agent de change \u00e0 la Bourse.",
 ch:[146.83,174.61,220]},

{t:'Hetzel',st:'La naissance des Voyages extraordinaires',y:'1862',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/Voyages_Extraordinaires_frontispiece.jpg/800px-Voyages_Extraordinaires_frontispiece.jpg',
 cr:'Frontispice des Voyages extraordinaires, Hetzel \u2014 Wikimedia Commons',
 txt:"La rencontre avec l'\u00e9diteur Pierre-Jules Hetzel, en mille huit cent soixante-deux, change tout. Hetzel lit le manuscrit de Cinq semaines en ballon. Il flaire le talent, mais exige de la rigueur scientifique. Ensemble, ils lancent les Voyages extraordinaires, une collection qui para\u00eetra pendant quarante ans.",
 q:"R\u00e9sumer toutes les connaissances g\u00e9ographiques, g\u00e9ologiques, physiques, astronomiques, amass\u00e9es par la science moderne.",
 qs:'Prospectus des Voyages extraordinaires, 1866',
 ch:[130.81,164.81,196]},

{t:'Cinq semaines en ballon',st:'Le premier voyage',y:'1863',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Cinq_Semaines_en_ballon_002.png/800px-Cinq_Semaines_en_ballon_002.png',
 cr:'Illustration par \u00c9douard Riou, Hetzel, 1863 \u2014 Wikimedia Commons',
 txt:"Cinq semaines en ballon para\u00eet le trente et un janvier mille huit cent soixante-trois. Le docteur Fergusson survole l'Afrique dans le Victoria. Le public s'enflamme. Un roman d'aventures fond\u00e9 sur la g\u00e9ographie r\u00e9elle et les lois de l'a\u00e9ronautique. Verne a invent\u00e9 un genre.",
 ch:[174.61,220,261.63]},

{t:'De la Terre \u00e0 la Lune',st:'Le r\u00eave spatial',y:'1865',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/%27From_the_Earth_to_the_Moon%27_by_Henri_de_Montaut_07.jpg/800px-%27From_the_Earth_to_the_Moon%27_by_Henri_de_Montaut_07.jpg',
 cr:'Illustration par Henri de Montaut, Hetzel, 1868 \u2014 Wikimedia Commons',
 txt:"Trois Am\u00e9ricains se font propulser vers la Lune dans un obus g\u00e9ant, tir\u00e9 par un canon de neuf cents pieds. De la Terre \u00e0 la Lune, publi\u00e9 en mille huit cent soixante-cinq, anticipe la conqu\u00eate spatiale avec un si\u00e8cle d'avance. Verne choisit la Floride comme site de lancement. La NASA s'en souviendra.",
 ch:[164.81,196,246.94]},

{t:'Vingt mille lieues sous les mers',st:'Le capitaine Nemo',y:'1870',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/48/Giant_squid_twenty_thousand_leagues_under_the_sea.jpg/800px-Giant_squid_twenty_thousand_leagues_under_the_sea.jpg',
 cr:'Alphonse de Neuville, Hetzel, 1871 \u2014 Wikimedia Commons',
 txt:"En mille huit cent soixante-dix, le capitaine Nemo plonge dans les abysses \u00e0 bord du Nautilus. Vingt mille lieues sous les mers impose au monde un personnage ambigu : savant, misanthrope, vengeur des opprim\u00e9s. Les gravures d'Alphonse de Neuville et \u00c9douard Riou fixent pour un si\u00e8cle l'image du sous-marin et du calmar g\u00e9ant.",
 q:"La mer est tout ! Elle couvre les sept dixi\u00e8mes du globe terrestre.",
 qs:'Capitaine Nemo',
 ch:[65.41,77.78,98]},

{t:'Le Tour du monde en 80 jours',st:'Le pari de Phileas Fogg',y:'1872',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/%27Around_the_World_in_Eighty_Days%27_by_Neuville_and_Benett_53.jpg/800px-%27Around_the_World_in_Eighty_Days%27_by_Neuville_and_Benett_53.jpg',
 cr:'Alphonse de Neuville et L\u00e9on Benett, 1873 \u2014 Wikimedia Commons',
 txt:"Phileas Fogg parie vingt mille livres sterling qu'il bouclera le tour du monde en quatre-vingts jours. Le roman para\u00eet en feuilleton dans Le Temps, \u00e0 l'automne mille huit cent soixante-douze. Fogg et Passepartout traversent l'Inde, la mer de Chine, les plaines am\u00e9ricaines. Tout Paris suit leurs aventures.",
 q:"Un vrai Anglais ne plaisante jamais quand il s'agit d'une chose aussi s\u00e9rieuse qu'un pari.",
 qs:'Le Tour du monde en quatre-vingts jours',
 ch:[98,123.47,146.83]},

{t:"L'\u00cele myst\u00e9rieuse",st:'Le dernier mot de la trilogie',y:'1875',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/%27The_Mysterious_Island%27_by_Jules_F%C3%A9rat_002.jpg/800px-%27The_Mysterious_Island%27_by_Jules_F%C3%A9rat_002.jpg',
 cr:'Illustration par Jules F\u00e9rat, Hetzel, 1875 \u2014 Wikimedia Commons',
 txt:"Des prisonniers de la guerre de S\u00e9cession s'\u00e9chouent sur une \u00eele volcanique du Pacifique. L'ing\u00e9nieur Cyrus Smith y reconstruit la civilisation \u00e0 partir de rien. L'\u00cele myst\u00e9rieuse, publi\u00e9e en mille huit cent soixante-quinze, r\u00e9unit Robinson Cruso\u00e9 et le capitaine Nemo dans un m\u00eame r\u00e9cit, le dernier mot de la trilogie vernienne.",
 ch:[87.31,103.83,130.81]},

{t:'Amiens',st:'Les derni\u00e8res ann\u00e9es',y:'1905',
 url:'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/JulesVerneTomb.jpg/800px-JulesVerneTomb.jpg',
 cr:'Tombe de Jules Verne par Albert Roze, Amiens \u2014 Wikimedia Commons',
 txt:"Verne s'installe \u00e0 Amiens en mille huit cent soixante et onze. Il y vivra trente-quatre ans, si\u00e9gera au conseil municipal, \u00e9crira sans rel\u00e2che. En mille huit cent quatre-vingt-six, son neveu Gaston lui tire dessus et le blesse \u00e0 la jambe. Il continue d'\u00e9crire. Il meurt le vingt-quatre mars mille neuf cent cinq. Sa tombe \u00e0 Amiens le montre sortant de terre, le bras tendu vers le ciel.",
 q:"Tout ce qu'un homme est capable d'imaginer, d'autres hommes seront capables de le r\u00e9aliser.",
 qs:'Attribu\u00e9 \u00e0 Jules Verne',
 ch:[110,130.81,164.81]}
];

var cur=0,musOn=false,narOn=false,actx=null,rev=null,mgain=null,oscs=[],fv=null;

function build(){
  var mu=document.getElementById('museum'),tl=document.getElementById('tl');
  CH.forEach(function(c,i){
    var s=document.createElement('section');
    s.className='ch';s.id='c'+i;
    var qh='';
    if(c.q)qh='<blockquote class="qu"><p>'+c.q+'</p><cite>\u2014 '+c.qs+'</cite></blockquote>';
    var safe=c.t.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    s.innerHTML='<div class="ch-in">'
      +'<div class="ch-hdr"><span class="ch-n">'+R[i]+'</span><span class="ch-y">'+c.y+'</span></div>'
      +'<div class="exh"><div class="exh-fr">'
      +'<div class="exh-ph"><div class="ph-num">'+R[i]+'</div><div class="ph-lbl">'+c.y+' \u2014 '+c.t+'</div></div>'
      +'<img src="'+c.url+'" alt="'+safe+'" loading="'+(i<2?'eager':'lazy')+'" crossorigin="anonymous"'
      +' onload="this.classList.add(\'ld\')"'
      +' onerror="this.style.display=\'none\'">'
      +'</div><div class="exh-lb">'+c.cr+'</div></div>'
      +'<h2 class="ch-t">'+c.t+'</h2>'
      +'<div class="ch-st">'+c.st+'</div>'
      +'<div class="narr">'+c.txt+'</div>'
      +qh
      +'</div>';
    mu.appendChild(s);

    var dot=document.createElement('div');
    dot.className='td'+(i===0?' on':'');dot.dataset.i=i;
    dot.innerHTML='<span class="tlab">'+c.y+' \u2014 '+c.t+'</span>';
    dot.onclick=function(){goTo(i)};
    tl.appendChild(dot);
  });
}

function goTo(i){if(i<0||i>=CH.length)return;document.getElementById('c'+i).scrollIntoView({behavior:'smooth'})}
function setActive(i){
  if(i===cur)return;cur=i;
  document.querySelectorAll('.td').forEach(function(d,j){d.classList.toggle('on',j===i)});
  document.getElementById('ci').textContent=R[i]+' / '+R[CH.length-1];
  if(musOn)playMus(i);
  if(narOn)speak(i);
}
function setupObs(){
  var obs=new IntersectionObserver(function(es){
    es.forEach(function(e){
      var idx=parseInt(e.target.id.replace('c',''));
      if(e.isIntersecting){e.target.classList.add('vis');setActive(idx)}
    });
  },{root:document.getElementById('museum'),threshold:0.45});
  document.querySelectorAll('.ch').forEach(function(s){obs.observe(s)});
}

function initAudio(){
  actx=new(window.AudioContext||window.webkitAudioContext)();
  var len=actx.sampleRate*2.5,buf=actx.createBuffer(2,len,actx.sampleRate);
  for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var j=0;j<len;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/len,2.5)}
  rev=actx.createConvolver();rev.buffer=buf;
  mgain=actx.createGain();mgain.gain.value=.7;
  var wg=actx.createGain();wg.gain.value=.4;
  var dg=actx.createGain();dg.gain.value=.6;
  rev.connect(wg);wg.connect(mgain);dg.connect(mgain);mgain.connect(actx.destination);
  actx._d=dg;actx._w=rev;
}
function playMus(idx){
  stopMus();if(!actx||!musOn)return;
  var chord=CH[idx].ch,now=actx.currentTime;
  oscs=[];
  chord.forEach(function(f){
    var o1=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();
    o1.type='sine';o2.type='sine';o1.frequency.value=f;o2.frequency.value=f*1.004;
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.035,now+3);
    o1.connect(g);o2.connect(g);g.connect(actx._d);g.connect(actx._w);
    o1.start(now);o2.start(now);
    oscs.push({o:o1,g:g},{o:o2,g:g});
  });
  var co=actx.createOscillator(),cg=actx.createGain();
  co.type='sine';co.frequency.value=chord[2]*4;
  cg.gain.setValueAtTime(.05,now);cg.gain.exponentialRampToValueAtTime(.001,now+2.5);
  co.connect(cg);cg.connect(actx._w);co.start(now);co.stop(now+2.5);
}
function stopMus(){
  if(!oscs.length||!actx)return;
  var now=actx.currentTime,seen=[];
  oscs.forEach(function(x){
    if(seen.indexOf(x.g)<0){x.g.gain.linearRampToValueAtTime(0,now+2);seen.push(x.g)}
    try{x.o.stop(now+2.1)}catch(e){}
  });
  oscs=[];
}

function findVoice(){
  if(typeof speechSynthesis==='undefined')return null;
  var v=speechSynthesis.getVoices(),fr=v.filter(function(x){return x.lang.indexOf('fr')===0});
  var m=fr.filter(function(x){return/thomas|henri|paul|pierre|mathieu|jacques|louis|male|homme/i.test(x.name)});
  return m[0]||fr[0]||v[0]||null;
}
function speak(idx){
  if(typeof speechSynthesis==='undefined')return;
  speechSynthesis.cancel();
  if(!narOn||!fv)return;
  var txt=CH[idx].txt,u=new SpeechSynthesisUtterance(txt);
  u.voice=fv;u.lang='fr-FR';u.rate=.9;u.pitch=.9;
  var nd=document.getElementById('nd');
  nd.textContent=txt;nd.classList.add('vis');
  if(mgain&&actx)mgain.gain.linearRampToValueAtTime(.3,actx.currentTime+.5);
  u.onend=u.onerror=function(){
    nd.classList.remove('vis');
    if(mgain&&actx)mgain.gain.linearRampToValueAtTime(.7,actx.currentTime+.5);
  };
  speechSynthesis.speak(u);
}
if(typeof speechSynthesis!=='undefined'){
  if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=function(){fv=findVoice()};
  fv=findVoice();
}

document.getElementById('np').onclick=function(){goTo(cur-1)};
document.getElementById('nn').onclick=function(){goTo(cur+1)};
document.getElementById('bm').onclick=function(){
  musOn=!musOn;this.classList.toggle('on',musOn);
  if(musOn)playMus(cur);else stopMus();
};
document.getElementById('bn').onclick=function(){
  narOn=!narOn;this.classList.toggle('on',narOn);
  if(narOn)speak(cur);
  else{if(typeof speechSynthesis!=='undefined')speechSynthesis.cancel();document.getElementById('nd').classList.remove('vis')}
};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();goTo(cur+1)}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();goTo(cur-1)}
});

document.getElementById('go').onclick=function(){
  narOn=document.getElementById('oN').checked;
  musOn=document.getElementById('oM').checked;
  initAudio();fv=findVoice();
  document.getElementById('start').classList.add('out');
  document.getElementById('museum').style.display='block';
  document.getElementById('tl').style.display='flex';
  document.getElementById('ctrl').style.display='block';
  document.getElementById('bm').classList.toggle('on',musOn);
  document.getElementById('bn').classList.toggle('on',narOn);
  setupObs();
  setTimeout(function(){
    var first=document.querySelector('.ch');
    if(first)first.classList.add('vis');
    setActive(0);
  },300);
};

(function(){
  var pf=document.getElementById('pf');
  pf.style.width='30%';
  setTimeout(function(){
    build();
    pf.style.width='70%';
    document.getElementById('start-portrait').src=CH[0].url;
    fv=findVoice();
    pf.style.width='100%';
    setTimeout(function(){
      document.getElementById('loader').classList.add('done');
      document.getElementById('start').style.display='flex';
    },400);
  },150);
})();
</script>
