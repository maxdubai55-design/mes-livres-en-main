<style>
/* ── BD Design System ── committed dark+saturated palette */
:root {
  --ink: #1a1a2e;
  --paper: #fdf6e3;
  --cream: #f5ecd5;
  --sky: #3a7bd5;
  --ocean: #1a4a7a;
  --gold: #d4a843;
  --red: #c0392b;
  --green: #27ae60;
  --warm: #e67e22;
  --skin: #f0b88a;
  --hair-dark: #3a2818;
  --hair-grey: #8a8078;
  --hair-white: #d0ccc4;
  --suit: #2a2a3e;
  color-scheme: dark;
}
body { background: var(--ink); color: var(--paper); margin: 0; overflow: hidden; font-family: 'Patrick Hand', cursive; }

#c { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

/* ── Panel Frame ── */
.panel-frame {
  position: fixed; inset: 0;
  border: 6px solid var(--ink);
  border-radius: 4px;
  pointer-events: none; z-index: 75;
  transition: border-width 0.9s ease;
}
.panel-frame.closing { border-width: 52vmax; }

/* ── Halftone overlay ── */
.halftone {
  position: fixed; inset: 0; z-index: 52; pointer-events: none;
  background-image: radial-gradient(var(--ink) 0.5px, transparent 0.5px);
  background-size: 4px 4px;
  opacity: 0.025; mix-blend-mode: multiply;
}

/* ── Vignette ── */
.vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.5) 100%); pointer-events: none; z-index: 51; }

/* ── Fade ── */
#fade { position: fixed; inset: 0; background: var(--ink); z-index: 70; opacity: 0; pointer-events: none; transition: opacity 1s ease; }
#fade.active { opacity: 1; }

/* ── Start Screen ── */
#start-screen {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  background: var(--ink);
  transition: opacity 1.2s ease;
}
#start-screen.leaving { opacity: 0; pointer-events: none; }
.start-content {
  text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.start-content h1 {
  font-family: 'Bangers', cursive;
  font-size: clamp(2.8rem, 9vw, 6rem);
  color: var(--gold);
  letter-spacing: 0.06em;
  margin: 0 0 0.1em;
  text-shadow: 4px 4px 0 var(--ink), 5px 5px 0 rgba(0,0,0,0.3);
  -webkit-text-stroke: 2px var(--ink);
  transform: rotate(-2deg);
}
.start-sub {
  font-family: 'Cinzel', serif; font-weight: 400;
  font-size: clamp(0.9rem, 2vw, 1.3rem);
  color: var(--cream); letter-spacing: 0.2em; text-transform: uppercase;
  margin: 0 0 0.5em; opacity: 0.85;
}
.start-dates {
  font-family: 'Patrick Hand', cursive;
  font-size: clamp(1rem, 2vw, 1.2rem);
  color: var(--gold); margin: 0 0 2em; opacity: 0.7;
}
#start-btn {
  font-family: 'Bangers', cursive; font-size: clamp(1.1rem, 2vw, 1.4rem);
  letter-spacing: 0.08em; color: var(--ink); background: var(--gold);
  border: 3px solid var(--ink); border-radius: 8px;
  padding: 0.7em 2.5em; cursor: pointer;
  box-shadow: 4px 4px 0 var(--ink);
  transition: all 0.15s;
  transform: rotate(1deg);
}
#start-btn:hover { transform: rotate(0deg) scale(1.05); box-shadow: 2px 2px 0 var(--ink); }
#start-btn:active { transform: scale(0.98); box-shadow: 1px 1px 0 var(--ink); }

/* ── Caption Box (narrator) ── */
#caption {
  position: fixed;
  top: clamp(36px, 7vh, 65px);
  left: max(24px, env(safe-area-inset-left, 0px));
  max-width: min(420px, 75vw);
  background: var(--cream);
  border: 2.5px solid var(--ink);
  padding: 14px 18px;
  font-size: clamp(0.92rem, 1.6vw, 1.05rem);
  line-height: 1.65; color: var(--ink);
  z-index: 66;
  box-shadow: 3px 3px 0 rgba(0,0,0,0.25);
  opacity: 0; transition: opacity 0.5s ease;
  pointer-events: none;
}
#caption.visible { opacity: 1; }

/* ── Speech Bubble ── */
.bubble {
  position: fixed;
  background: #fff; border: 2.5px solid var(--ink);
  border-radius: 20px; padding: 10px 16px;
  font-size: clamp(0.85rem, 1.4vw, 1rem);
  line-height: 1.5; color: var(--ink);
  max-width: min(280px, 55vw);
  z-index: 67; pointer-events: none;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
  opacity: 0; transition: opacity 0.4s ease;
}
.bubble.visible { opacity: 1; }
.bubble::after {
  content: ''; position: absolute; bottom: -14px; left: 28px;
  border: 8px solid transparent; border-top-color: var(--ink);
}
.bubble::before {
  content: ''; position: absolute; bottom: -10px; left: 29px;
  border: 7px solid transparent; border-top-color: #fff;
}

/* ── Onomatopoeia ── */
#sfx {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%) rotate(-6deg) scale(0);
  font-family: 'Bangers', cursive;
  font-size: clamp(4rem, 14vw, 10rem);
  color: var(--red); z-index: 85;
  pointer-events: none;
  text-shadow: 4px 4px 0 var(--ink);
  -webkit-text-stroke: 3px var(--ink);
  transition: transform 0.15s cubic-bezier(0.68,-0.55,0.27,1.55), opacity 0.25s;
  opacity: 0;
}
#sfx.pop { transform: translate(-50%,-50%) rotate(-6deg) scale(1); opacity: 1; }

/* ── Action Lines ── */
.action-lines {
  position: fixed; inset: 0; z-index: 53; pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
  background: repeating-conic-gradient(transparent 0deg, transparent 3deg, rgba(0,0,0,0.03) 3deg, rgba(0,0,0,0.03) 6deg) center/100% 100%;
}
.action-lines.visible { opacity: 1; }

/* ── Chapter Card ── */
#ch-card {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  text-align: center; z-index: 68;
  opacity: 0; transition: opacity 1s ease;
  pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#ch-card.visible { opacity: 1; }
.cc-num { font-family: 'Cinzel', serif; font-size: clamp(0.7rem,1.2vw,0.85rem); letter-spacing: 0.35em; color: var(--gold); text-transform: uppercase; margin-bottom: 0.5em; }
.cc-title { font-family: 'Bangers', cursive; font-size: clamp(1.8rem,5vw,3.5rem); color: var(--paper); text-shadow: 3px 3px 0 var(--ink); -webkit-text-stroke: 1px var(--ink); margin-bottom: 0.2em; transform: rotate(-1deg); }
.cc-year { font-family: 'Patrick Hand', cursive; font-size: clamp(1rem,1.8vw,1.2rem); color: var(--gold); }

/* ── Work Title ── */
#work-title {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  text-align: center; z-index: 64; pointer-events: none;
  opacity: 0; transition: opacity 0.6s ease;
}
#work-title.visible { opacity: 1; }
.wt-name { font-family: 'Bangers', cursive; font-size: clamp(1.3rem,3.5vw,2.2rem); color: var(--paper); text-shadow: 2px 2px 0 var(--ink); }
.wt-year { font-family: 'Patrick Hand', cursive; font-size: clamp(0.9rem,1.5vw,1.1rem); color: var(--gold); margin-top: 0.2em; }

/* ── Controls ── */
#controls {
  position: fixed; bottom: clamp(4px,1.5vh,12px); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; z-index: 90;
  padding: 5px 14px;
  background: rgba(26,26,46,0.7); border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.1);
  opacity: 0; transition: opacity 0.4s ease;
}
#controls.visible { opacity: 1; }
#controls:hover { opacity: 1 !important; }
.cb { background: none; border: none; color: var(--paper); font-size: 1rem; cursor: pointer; opacity: 0.6; transition: opacity 0.2s; padding: 4px 8px; font-family: system-ui, sans-serif; }
.cb:hover,.cb:focus-visible { opacity: 1; }
#tl { width: clamp(100px,28vw,260px); height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; position: relative; cursor: pointer; }
#prog { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; transition: width 0.3s linear; }
#dots { position: absolute; top: -3px; width: 100%; height: 9px; display: flex; justify-content: space-between; pointer-events: none; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; }
.dot.on { background: var(--gold); }

/* ── End ── */
#end {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 2s ease; pointer-events: none; background: rgba(26,26,46,0.85);
}
#end.visible { opacity: 1; pointer-events: auto; }
.end-c { text-align: center; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.end-c h2 { font-family: 'Bangers', cursive; font-size: clamp(2rem,5vw,3.5rem); color: var(--gold); text-shadow: 3px 3px 0 var(--ink); margin: 0 0 0.5em; }
.end-c p { font-size: clamp(0.85rem,1.3vw,1rem); color: var(--cream); margin: 0.3em 0; opacity: 0.8; }
#replay { font-family: 'Bangers', cursive; font-size: 1.1rem; color: var(--ink); background: var(--gold); border: 2px solid var(--ink); border-radius: 6px; padding: 0.5em 2em; cursor: pointer; margin-top: 1.5em; box-shadow: 3px 3px 0 var(--ink); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   JULES VERNE — BD 3D BIOGRAPHY
   ============================================================ */

const MB = /Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 768;
const S = MB ? 8 : 12;
const PC = MB ? 400 : 1000;
const OS = MB ? 50 : 90;

// ── Toon Gradient ──
let toonGrad;
try {
  const d = new Uint8Array([40,40,40,255, 110,110,110,255, 190,190,190,255, 255,255,255,255]);
  toonGrad = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat);
  toonGrad.magFilter = THREE.NearestFilter;
  toonGrad.minFilter = THREE.NearestFilter;
  toonGrad.needsUpdate = true;
} catch(e) { toonGrad = null; }

function T(color, emissive) {
  const m = new THREE.MeshToonMaterial({ color });
  if (toonGrad) m.gradientMap = toonGrad;
  if (emissive) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = 0.3; }
  return m;
}

// r128 defines position/rotation/quaternion/scale as non-writable via defineProperty
const _OA = Object.assign;
Object.assign = function(target) {
  if (target instanceof THREE.Object3D) {
    for (let i = 1; i < arguments.length; i++) {
      const src = arguments[i]; if (!src) continue;
      const keys = Object.keys(src);
      for (let k = 0; k < keys.length; k++) {
        const key = keys[k], val = src[key];
        if ((key==='position'||key==='scale')&&val&&val.isVector3) target[key].copy(val);
        else if (key==='rotation'&&val&&val.isEuler) target[key].copy(val);
        else if (key==='quaternion'&&val&&val.isQuaternion) target[key].copy(val);
        else try{target[key]=val;}catch(e){}
      }
    }
    return target;
  }
  return _OA.apply(null, arguments);
};

// ── Three.js Setup ──
const cv = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: !MB });
R.setSize(innerWidth, innerHeight);
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 1.2;

const SC = new THREE.Scene();
SC.background = new THREE.Color(0x4a8ac7);
SC.fog = new THREE.FogExp2(0x4a8ac7, 0.008);

const CAM = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
CAM.position.set(0, 5, 20);

const DL = new THREE.DirectionalLight(0xffeedd, 1.0);
DL.position.set(5, 12, 8);
SC.add(DL);
const AL = new THREE.AmbientLight(0x445566, 0.5);
SC.add(AL);
const HL = new THREE.HemisphereLight(0x87ceeb, 0x444422, 0.3);
SC.add(HL);

// ── Ocean ──
const oG = new THREE.PlaneGeometry(250, 250, OS, OS);
const oM = T(0x2a6a9a);
const ocean = new THREE.Mesh(oG, oM);
ocean.rotation.x = -Math.PI/2;
ocean.position.y = -2;
SC.add(ocean);

// ── Stars ──
const stG = new THREE.BufferGeometry();
const stP = new Float32Array(2000 * 3);
for (let i = 0; i < 2000; i++) {
  const th = Math.random()*Math.PI*2, ph = Math.acos(Math.random()*2-1), r = 100+Math.random()*80;
  stP[i*3] = r*Math.sin(ph)*Math.cos(th);
  stP[i*3+1] = Math.abs(r*Math.cos(ph));
  stP[i*3+2] = r*Math.sin(ph)*Math.sin(th);
}
stG.setAttribute('position', new THREE.BufferAttribute(stP, 3));
SC.add(new THREE.Points(stG, new THREE.PointsMaterial({ color: 0xffeedd, size: 0.4, transparent: true, opacity: 0.7 })));

// ── Particles ──
const pG = new THREE.BufferGeometry();
const pP = new Float32Array(PC*3), pC = new Float32Array(PC*3);
for (let i=0;i<PC;i++){pP[i*3]=(Math.random()-.5)*50;pP[i*3+1]=Math.random()*25-5;pP[i*3+2]=(Math.random()-.5)*50;pC[i*3]=pC[i*3+1]=pC[i*3+2]=1;}
pG.setAttribute('position', new THREE.BufferAttribute(pP, 3));
pG.setAttribute('color', new THREE.BufferAttribute(pC, 3));
const parts = new THREE.Points(pG, new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.6, depthWrite: false }));
SC.add(parts);

// ── Character Factory ──
function mkHuman(opts) {
  const g = new THREE.Group();
  const sk = T(opts.skin || 0xf0b88a);
  const hr = T(opts.hair || 0x3a2818);
  const cl = T(opts.cloth || 0x2a2a3e);
  const sh = T(opts.shirt || 0xe8e0d0);
  const bt = T(opts.boot || 0x2a1a0a);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, S, S), sk);
  head.position.y = 1.62; g.add(head);
  // Hair
  const hairG = new THREE.SphereGeometry(0.24, S, S, 0, Math.PI*2, 0, Math.PI*0.55);
  const hairM = new THREE.Mesh(hairG, hr); hairM.position.y = 1.7; g.add(hairM);
  // Eyes
  const eM = new THREE.MeshBasicMaterial({color: 0x334466});
  const eG = new THREE.SphereGeometry(0.028, 6, 6);
  const eL = new THREE.Mesh(eG, eM); eL.position.set(-0.075, 1.64, 0.18); g.add(eL);
  const eR = new THREE.Mesh(eG, eM); eR.position.set(0.075, 1.64, 0.18); g.add(eR);
  // Pupils
  const puM = new THREE.MeshBasicMaterial({color:0x111111});
  const puG = new THREE.SphereGeometry(0.015,6,6);
  g.add(Object.assign(new THREE.Mesh(puG,puM),{position:new THREE.Vector3(-0.075,1.64,0.2)}));
  g.add(Object.assign(new THREE.Mesh(puG,puM),{position:new THREE.Vector3(0.075,1.64,0.2)}));
  // Nose
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.03,0.06,6), sk);
  nose.position.set(0,1.58,0.2); nose.rotation.x=-Math.PI/2; g.add(nose);
  // Mouth
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.08,0.015,0.02), new THREE.MeshBasicMaterial({color:0x994444}));
  mouth.position.set(0,1.52,0.19); g.add(mouth);
  // Beard
  if (opts.beard) {
    const bG = new THREE.SphereGeometry(0.2, S, S, 0, Math.PI*2, Math.PI*0.35, Math.PI*0.65);
    const bM = new THREE.Mesh(bG, T(opts.beard)); bM.position.set(0,1.46,0.04);
    bM.scale.set(1, opts.beardLen || 1, 0.8); g.add(bM);
  }
  // Neck
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.1,6), sk), {position:new THREE.Vector3(0,1.42,0)}));
  // Torso
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.23,0.6,8), cl);
  torso.position.y = 1.08; g.add(torso);
  // Collar / shirt
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.14,0.06,0.1), sh), {position:new THREE.Vector3(0,1.36,0.12)}));
  // Bowtie
  g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.12,0.04,0.04), T(opts.tie||0x8b2020)), {position:new THREE.Vector3(0,1.33,0.16)}));
  // Arms
  const aG = new THREE.CylinderGeometry(0.045,0.05,0.48,6);
  const la = new THREE.Mesh(aG, cl); la.position.set(-0.26,1.02,0); la.rotation.z=0.12; g.add(la);
  const ra = new THREE.Mesh(aG, cl); ra.position.set(0.26,1.02,0); ra.rotation.z=-0.12; g.add(ra);
  // Hands
  const hG = new THREE.SphereGeometry(0.04,6,6);
  g.add(Object.assign(new THREE.Mesh(hG,sk),{position:new THREE.Vector3(-0.3,0.76,0)}));
  g.add(Object.assign(new THREE.Mesh(hG,sk),{position:new THREE.Vector3(0.3,0.76,0)}));
  // Legs
  const lG = new THREE.CylinderGeometry(0.06,0.05,0.65,6);
  const ll = new THREE.Mesh(lG, T(0x1a1a28)); ll.position.set(-0.1,0.45,0); g.add(ll);
  const rl = new THREE.Mesh(lG, T(0x1a1a28)); rl.position.set(0.1,0.45,0); g.add(rl);
  // Feet
  const fG = new THREE.BoxGeometry(0.09,0.04,0.15);
  g.add(Object.assign(new THREE.Mesh(fG,bt),{position:new THREE.Vector3(-0.1,0.1,0.03)}));
  g.add(Object.assign(new THREE.Mesh(fG,bt),{position:new THREE.Vector3(0.1,0.1,0.03)}));
  // Hat
  if (opts.hat === 'top') {
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.3,S), T(0x1a1a1a)),{position:new THREE.Vector3(0,1.95,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.03,S), T(0x1a1a1a)),{position:new THREE.Vector3(0,1.8,0)}));
  }
  if (opts.hat === 'cap') {
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.06,S), T(0x2a2a2a)),{position:new THREE.Vector3(0,1.82,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.22,0.02,0.12), T(0x2a2a2a)),{position:new THREE.Vector3(0,1.82,0.18)}));
  }
  // Cane
  if (opts.cane) {
    const cane = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,1,6), T(0x3a2a1a));
    cane.position.set(0.35,0.5,0.1); cane.rotation.z = -0.05; g.add(cane);
    g.add(Object.assign(new THREE.Mesh(new THREE.TorusGeometry(0.04,0.015,6,8), T(0x3a2a1a)),{position:new THREE.Vector3(0.34,1.0,0.1),rotation:new THREE.Euler(Math.PI/2,0,0)}));
  }
  // Outlines on key parts
  [head, torso, la, ra, ll, rl].forEach(m => {
    const o = new THREE.Mesh(m.geometry, new THREE.MeshBasicMaterial({color:0x000000,side:THREE.BackSide}));
    o.position.copy(m.position); o.rotation.copy(m.rotation);
    o.scale.copy(m.scale).multiplyScalar(1.08); g.add(o);
  });

  g._p = { la, ra, ll, rl, head };
  return g;
}

function animChar(ch, t, action) {
  const p = ch._p; if (!p) return;
  if (action === 'walk') {
    p.la.rotation.x = Math.sin(t*4)*0.35;
    p.ra.rotation.x = -Math.sin(t*4)*0.35;
    p.ll.rotation.x = -Math.sin(t*4)*0.3;
    p.rl.rotation.x = Math.sin(t*4)*0.3;
    ch.position.y += Math.abs(Math.sin(t*4))*0.005;
  } else if (action === 'idle') {
    p.la.rotation.x = Math.sin(t*0.6)*0.04;
    p.ra.rotation.x = -Math.sin(t*0.6)*0.04;
  } else if (action === 'write') {
    p.ra.rotation.x = -0.7+Math.sin(t*5)*0.04;
    p.ra.rotation.z = -0.3;
  } else if (action === 'look') {
    p.head.rotation.y = Math.sin(t*0.3)*0.2;
  }
}

function mkShip(s) {

  const sail = new THREE.Mesh(new THREE.PlaneGeometry(1.2*s,2.2*s), T(0xeeddbb));
  sail.material.side = THREE.DoubleSide;
  sail.position.set(0.2*s,2.3*s,0); sail.rotation.y=0.15; g.add(sail);
  return g;
}
function mkSub(s) {
  const g = new THREE.Group(), m = T(0x3a5a6a);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6*s,0.6*s,7*s,S), m);

  g.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.6*s,S,S), m),{position:new THREE.Vector3(3.5*s,0,0)}));
  g.add(Object.assign(new THREE.Mesh(new THREE.ConeGeometry(0.6*s,1.5*s,S), m),{position:new THREE.Vector3(-4*s,0,0),rotation:new THREE.Euler(0,0,Math.PI/2)}));
  g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.25*s,0.3*s,0.8*s,8), m),{position:new THREE.Vector3(0.5*s,0.8*s,0)}));
  for (let i=0;i<5;i++){
    g.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.08*s,6,6), T(0xaacc88,0x446633)),{position:new THREE.Vector3(-1.5*s+i*0.8*s,0,0.6*s)}));
  }
  return g;
}
function mkBalloon(s) {
  const g = new THREE.Group();
  const env = new THREE.Mesh(new THREE.SphereGeometry(2*s,16,16), T(0xcc4422));
  env.scale.y=1.3; env.position.y=4*s; g.add(env);

  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([dx,dz])=>{

      new THREE.Vector3(dx*0.35*s,0.75*s,dz*0.35*s),

    ]), rm));

  return g;
}
function mkRocket(s) {
  const g = new THREE.Group(), m = T(0xcccccc);
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.4*s,0.5*s,4*s,S), m));

// ── MUSIC ENGINE ──
let AX = null;
const N={C2:65.41,D2:73.42,E2:82.41,F2:87.31,G2:98,A2:110,Bb2:116.54,B2:123.47,
  C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,Bb3:233.08,B3:246.94,
  C4:261.63,Cs4:277.18,D4:293.66,E4:329.63,F4:349.23,Fs4:369.99,G4:392,A4:440,Bb4:466.16,B4:493.88,
  C5:523.25,D5:587.33};

let masterGain, musicGain, sfxGain;
let musicPlaying = false, nextThemeAt = 0, currentMood = 'mystery';

function initAudio() {
  try {
    AX = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AX.createGain(); masterGain.gain.value = 0.6; masterGain.connect(AX.destination);
    musicGain = AX.createGain(); musicGain.gain.value = 0.18; musicGain.connect(masterGain);
    sfxGain = AX.createGain(); sfxGain.gain.value = 0.4; sfxGain.connect(masterGain);
    // Ocean noise
    const bs = 2*AX.sampleRate, buf = AX.createBuffer(1,bs,AX.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<bs;i++) d[i]=Math.random()*2-1;
    const ns=AX.createBufferSource(); ns.buffer=buf; ns.loop=true;
    const lp=AX.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=350;
    const ng=AX.createGain(); ng.gain.value=0.04;
    ns.connect(lp); lp.connect(ng); ng.connect(masterGain); ns.start();
    window._oceanFilter = lp; window._oceanGain = ng;
    musicPlaying = true;
  } catch(e){}
}

function mNote(freq, time, dur, wave, vol) {
  if(!AX) return;
  const o=AX.createOscillator(); o.type=wave||'triangle'; o.frequency.value=freq;
  const g=AX.createGain();
  g.gain.setValueAtTime(0,time);
  g.gain.linearRampToValueAtTime(vol||0.08, time+0.03);
  g.gain.setValueAtTime((vol||0.08)*0.65, time+dur*0.5);
  g.gain.linearRampToValueAtTime(0, time+dur);
  o.connect(g); g.connect(musicGain); o.start(time); o.stop(time+dur+0.01);
}
function mChord(freqs, time, dur, wave, vol) { freqs.forEach(f=>mNote(f,time,dur,wave||'sine',vol||0.03)); }

function scheduleTheme(t, bpm, mood) {
  const q=60/bpm, hd=q*3;
  // Bass
  const bassF = mood==='triumph'?[N.D2,N.D2,N.A2,N.A2,N.G2,N.G2,N.A2,N.D2]
    : mood==='dark'?[N.D2,N.E2,N.D2,N.Bb2,N.D2,N.E2,N.D2,N.A2]
    : [N.D2,N.D2,N.Bb2,N.Bb2,N.F2,N.F2,N.A2,N.D2];
  bassF.forEach((f,i)=>mNote(f, t+i*hd/bassF.length*8, hd, 'sine', 0.06));

  // Pads
  if(mood!=='dark'){
    const pads = mood==='triumph'
      ? [[N.D3,N.Fs4,N.A3],[N.A3,N.Cs4,N.E3],[N.G3,N.B3,N.D3],[N.A3,N.D3,N.Fs4]]
      : [[N.D3,N.F3,N.A3],[N.Bb3,N.D3,N.F3],[N.F3,N.A3,N.C4],[N.A3,N.D3,N.E3]];
    pads.forEach((ch,i)=>mChord(ch, t+i*hd*2, hd*2, 'sine', 0.025));
  } else {
    mChord([N.D3,N.E3,N.Bb3], t, hd*4, 'sine', 0.02);
    mChord([N.D3,N.A3,N.E3], t+hd*4, hd*4, 'sine', 0.02);
  }

  // Melody
  if(mood!=='dark' && mood!=='mystery'){
    const ml = mood==='triumph'
      ? [N.D4,N.Fs4,N.A4,N.G4,N.Fs4,N.E4,N.D4,N.Fs4,N.B4,N.A4, N.Fs4,N.A4,N.D5,N.B4,N.A4,N.G4,N.Fs4,N.E4,N.D4,N.D4]
      : [N.D4,N.F4,N.A4,N.G4,N.F4,N.E4,N.D4,N.F4,N.Bb4,N.A4, N.F4,N.A4,N.C5,N.Bb4,N.A4,N.G4,N.F4,N.E4,N.D4,N.D4];
    const wave = mood==='intimate'?'sine': mood==='lively'?'square':'triangle';
    const vol = mood==='intimate'?0.04: mood==='epic'?0.09:0.07;
    const durs = [q,q,q, q,q,q, q,q,q, hd, q,q,q, q,q,q, q,q,q, hd];
    let ct=t;
    ml.forEach((f,i)=>{ mNote(f,ct,durs[i]||q,wave,vol); ct+=durs[i]||q; });
  }

  // Percussion (subtle)
  if(mood==='lively'||mood==='epic'||mood==='adventure'){
    for(let i=0;i<8;i++){
      const pt=t+i*hd;
      // Kick-like
      const o2=AX.createOscillator(); o2.type='sine'; o2.frequency.setValueAtTime(120,pt); o2.frequency.exponentialRampToValueAtTime(40,pt+0.1);
      const g2=AX.createGain(); g2.gain.setValueAtTime(0.05,pt); g2.gain.linearRampToValueAtTime(0,pt+0.15);
      o2.connect(g2); g2.connect(musicGain); o2.start(pt); o2.stop(pt+0.2);
    }
  }

  return 24*q;
}

function scheduleMusicLoop() {
  if(!AX||!musicPlaying) return;
  const now=AX.currentTime;
  while(nextThemeAt < now+3){
    const ch = CH[ST.ch] || CH[0];
    const dur = scheduleTheme(nextThemeAt, ch.audio?.bpm||100, currentMood);
    nextThemeAt += dur;
  }
}

// SFX
function sfxGunshot(){
  if(!AX)return;
  const t=AX.currentTime, dur=0.25, bs=AX.sampleRate*dur;
  const buf=AX.createBuffer(1,bs,AX.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<bs;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(AX.sampleRate*0.015));
  const s=AX.createBufferSource(); s.buffer=buf;
  const bp=AX.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2500; bp.Q.value=1;
  const g=AX.createGain(); g.gain.value=0.5;
  s.connect(bp); bp.connect(g); g.connect(sfxGain); s.start(t);
}
function sfxSplash(){
  if(!AX)return;
  const t=AX.currentTime, dur=0.5, bs=AX.sampleRate*dur;
  const buf=AX.createBuffer(1,bs,AX.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<bs;i++){const x=i/AX.sampleRate; d[i]=(Math.random()*2-1)*Math.exp(-x/0.15);}
  const s=AX.createBufferSource(); s.buffer=buf;
  const hp=AX.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=800;
  const g=AX.createGain(); g.gain.value=0.3;
  s.connect(hp); hp.connect(g); g.connect(sfxGain); s.start(t);
}

// ── PLAYBACK ──
const ST={playing:false,ch:-1,chStart:0,trans:false,started:false};
function sl(ms){return new Promise(r=>setTimeout(r,ms));}

async function goTo(idx){
  if(idx<0||idx>=CH.length||ST.trans)return;
  ST.trans=true;
  hideCaption();hideBubble();hideCard();hideWork();

  // Panel close transition
  panelEl.classList.add('closing');
  await sl(900);

  // Switch scene
  GR.forEach((g,i)=>g.visible=(i===idx));
  const ch=CH[idx];
  SC.fog.color.set(ch.bg); SC.fog.density=ch.fog;
  SC.background.set(ch.bg);
  DL.intensity=ch.dI; AL.intensity=ch.aI;
  oM.color.set(ch.oC); ocean.position.y=ch.oY;
  CAM.position.set(...ch.cam.s);
  // Reset particles
  for(let i=0;i<PC;i++){pP[i*3]=(Math.random()-.5)*50;pP[i*3+1]=Math.random()*25-5;pP[i*3+2]=(Math.random()-.5)*50;}
  pG.attributes.position.needsUpdate=true;

  dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
  currentMood = ch.audio?.mood || 'warm';
  nextThemeAt = AX ? AX.currentTime + 0.5 : 0;
  // Ocean audio
  if(window._oceanFilter){
    const t=AX.currentTime+1.5;
    window._oceanFilter.frequency.linearRampToValueAtTime(ch.wA>0.5?500:200, t);
    window._oceanGain.gain.linearRampToValueAtTime(ch.wA*0.04, t);
  }

  ST.ch=idx;

  // Panel open
  panelEl.classList.remove('closing');
  await sl(600);

  showCard(ch);
  await sl(2800);
  hideCard();
  await sl(400);

  if(ch.caption) showCaption(ch.caption);

  // Delayed bubble
  if(ch.bubble){
    setTimeout(()=>showBubble(ch.bubble.text), ch.bubble.delay);
    setTimeout(()=>hideBubble(), ch.bubble.delay+4000);
  }
  // Delayed SFX text
  if(ch.sfxTrigger){
    setTimeout(()=>{
      showSfx(ch.sfxTrigger.text);
      alinesEl.classList.add('visible');
      sfxGunshot();
      setTimeout(()=>alinesEl.classList.remove('visible'),600);
    }, ch.sfxTrigger.delay);
  }

  ST.chStart=performance.now();
  ST.trans=false;
}

// ── OCEAN WAVES ──
function updOcean(time,amp){
  const p=oG.attributes.position, a=p.array;
  for(let i=0;i<p.count;i++){
    a[i*3+2]=(Math.sin(a[i*3]*0.04+time*0.8)*amp*0.5+Math.cos(a[i*3+1]*0.06+time*0.5)*amp*0.35+Math.sin((a[i*3]+a[i*3+1])*0.03+time*0.3)*amp*0.25);
  }
  p.needsUpdate=true; oG.computeVertexNormals();
}

// ── PARTICLES ──
function updParts(time,ci){
  const p=pP, c=pC;
  for(let i=0;i<PC;i++){
    const i3=i*3;
    if(ci===6){// Rain
      p[i3+1]-=0.22;if(p[i3+1]<-5){p[i3+1]=18;p[i3]=(Math.random()-.5)*25;p[i3+2]=(Math.random()-.5)*25;}
      c[i3]=0.5;c[i3+1]=0.5;c[i3+2]=0.6;
    } else if(ci===7){// Leaves
      p[i3]+=Math.sin(time*0.3+i)*0.008;p[i3+1]-=0.012;p[i3+2]+=Math.cos(time*0.4+i)*0.006;
      if(p[i3+1]<-2){p[i3+1]=10;p[i3]=(Math.random()-.5)*18;}
      c[i3]=1;c[i3+1]=0.5+Math.random()*0.2;c[i3+2]=0.08;
    } else if(ci===4){// Sparkles
      p[i3]+=Math.sin(time*1.5+i*0.5)*0.015;p[i3+1]+=Math.cos(time+i*0.3)*0.015;p[i3+2]+=Math.sin(time*0.8+i*0.7)*0.015;
      const h=(i/PC+time*0.08)%1;
      const col=new THREE.Color().setHSL(h,0.6,0.7);c[i3]=col.r;c[i3+1]=col.g;c[i3+2]=col.b;
    } else if(ci===5||ci===1){// Sea spray
      p[i3]+=(Math.random()-.5)*0.05;p[i3+1]+=0.02;
      if(p[i3+1]>8){p[i3+1]=-1;p[i3]=(Math.random()-.5)*40;p[i3+2]=(Math.random()-.5)*40;}
      c[i3]=0.85;c[i3+1]=0.9;c[i3+2]=1;
    } else if(ci===8){// Gold ascend
      p[i3]+=Math.sin(time+i)*0.008;p[i3+1]+=0.018;p[i3+2]+=Math.cos(time+i)*0.008;
      if(p[i3+1]>22){p[i3+1]=-3;p[i3]=(Math.random()-.5)*35;}
      c[i3]=1;c[i3+1]=0.82;c[i3+2]=0.35;
    } else {// Default drift
      p[i3]+=Math.sin(time*0.2+i)*0.003;p[i3+1]+=Math.cos(time*0.15+i*0.7)*0.002;
      c[i3]=c[i3+1]=c[i3+2]=0.8;
    }
  }
  pG.attributes.position.needsUpdate=true;pG.attributes.color.needsUpdate=true;
}

// ── PER-CHAPTER UPDATES ──
function updChapter(time, prog){
  const ci=ST.ch;
  if(ci===0&&CO[0]) { CO[0].sub.position.x=8-prog*16; CO[0].sub.position.y=-4+Math.sin(time)*0.3; }
  if(ci===1&&CO[1]) { [CO[1].s1,CO[1].s2].forEach((s,j)=>{s.position.y=Math.sin(time*0.8+j*2)*0.2;s.rotation.z=Math.sin(time*0.5+j)*0.03;}); animChar(CO[1].vy,time,'look'); }
  if(ci===2&&CO[2]) { animChar(CO[2].vy,time,'idle'); animChar(CO[2].dm,time,'idle'); }
  if(ci===3&&CO[3]) { CO[3].globe.rotation.y=time*0.3; animChar(CO[3].vm,time,'idle'); animChar(CO[3].hz,time,'idle'); }
  if(ci===4&&CO[4]) {
    CO[4].balloon.position.y=8+Math.sin(time*0.5)*1.2; CO[4].balloon.rotation.y=time*0.1;
    CO[4].sub.position.x=8+Math.sin(time*0.3)*2; CO[4].sub.position.y=-3+Math.sin(time*0.7)*0.5;
    CO[4].rocket.position.y=6+Math.sin(time*0.4)*2;
    if(CO[4].rocket._fl) CO[4].rocket._fl.scale.y=0.8+Math.sin(time*5)*0.3;
    CO[4].globe.rotation.y=time*0.2;
    CO[4].lava.material.opacity=0.4+Math.sin(time*2)*0.2;
    animChar(CO[4].vm,time,'idle');
    // Orbit camera
    const a=prog*Math.PI*2;
    CAM.position.x=Math.sin(a)*20;CAM.position.z=Math.cos(a)*20;CAM.position.y=5+Math.sin(prog*Math.PI)*3;
    // Works display
    const ch=CH[4];
    if(ch.works){
      let cw=null;
      for(let w=ch.works.length-1;w>=0;w--) if(prog>=ch.works[w].at){cw=ch.works[w];break;}
      if(cw){
        const wn=workEl.querySelector('.wt-name');
        if(wn.textContent!==cw.name){
          hideWork();
          setTimeout(()=>{
            showWork(cw.name,cw.year);
            if(cw.sfx){showSfx(cw.sfx);alinesEl.classList.add('visible');if(cw.sfx==='PLOUF!')sfxSplash();setTimeout(()=>alinesEl.classList.remove('visible'),500);}
          },300);
        }
      }
    }
  }
  if(ci===5&&CO[5]) { const y=CO[5].yacht; y.position.y=0.3+Math.sin(time*0.6)*0.3; y.rotation.z=Math.sin(time*0.4)*0.04; animChar(CO[5].vm,time,'idle'); }
  if(ci===6&&CO[6]) { animChar(CO[6].vo,time,'idle'); }
  if(ci===7&&CO[7]) { animChar(CO[7].vo,time,'write'); }
  if(ci===8&&CO[8]) { CO[8].pillar.material.opacity=0.06+Math.sin(time*0.5)*0.03; CO[8].pillar.rotation.y=time*0.1; }
}

// ── RENDER LOOP ──
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), time=now*0.001;
  const ch=CH[ST.ch]||CH[0];
  updOcean(time, ch.wA||0.5);

  if(ST.playing&&!ST.trans&&ST.ch>=0){
    const elapsed=now-ST.chStart;
    const dur=CH[ST.ch].dur;
    const prog=Math.min(elapsed/dur,1);
    const t=prog<0.5?4*prog*prog*prog:1-Math.pow(-2*prog+2,3)/2;

    if(ST.ch!==4){
      const c=CH[ST.ch].cam;
      CAM.position.set(c.s[0]+(c.e[0]-c.s[0])*t, c.s[1]+(c.e[1]-c.s[1])*t, c.s[2]+(c.e[2]-c.s[2])*t);
      CAM.lookAt(c.ls[0]+(c.le[0]-c.ls[0])*t, c.ls[1]+(c.le[1]-c.ls[1])*t, c.ls[2]+(c.le[2]-c.ls[2])*t);
    }
    updChapter(time, prog);
    progEl.style.width=(ST.ch+prog)/CH.length*100+'%';

    if(prog>=1){
      if(ST.ch<CH.length-1) goTo(ST.ch+1);
      else { ST.playing=false;hideCaption();hideWork();hideBubble();setTimeout(()=>document.getElementById('end').classList.add('visible'),2000); }
    }
  }
  updParts(time, ST.ch>=0?ST.ch:0);
  scheduleMusicLoop();
  R.render(SC,CAM);
}

document.getElementById('tl').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  goTo(Math.max(0,Math.min(Math.floor((e.clientX-r.left)/r.width*CH.length),CH.length-1)));
});
document.addEventListener('keydown',e=>{
  if(!ST.started)return;
  if(e.code==='Space'){e.preventDefault();ppBtn.click();}
  else if(e.code==='ArrowRight')document.getElementById('nb').click();
  else if(e.code==='ArrowLeft')document.getElementById('pb').click();
});
window.addEventListener('resize',()=>{CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});

let ctrlTo;
function showCtrl(){document.getElementById('controls').style.opacity='1';clearTimeout(ctrlTo);ctrlTo=setTimeout(()=>{if(ST.playing)document.getElementById('controls').style.opacity='0.3';},3000);}
document.addEventListener('mousemove',showCtrl);
document.addEventListener('touchstart',showCtrl);

animate();
</script>
